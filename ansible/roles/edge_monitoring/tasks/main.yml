---
- name: Check required variables
  ansible.builtin.assert:
    that:
      - letsencrypt_email | length > 0
      - vault_cloudflare_api_token is defined
      - vault_monitoring_basic_auth_password is defined
    fail_msg: "Set letsencrypt_email in group_vars/edge.yml and the two vault_ variables in vault.yml"

- name: Install certbot and helpers
  ansible.builtin.apt:
    name:
      - certbot
      - python3-certbot-dns-cloudflare
      - python3-passlib
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Cloudflare API credentials for certbot
  ansible.builtin.copy:
    content: "dns_cloudflare_api_token = {{ vault_cloudflare_api_token }}\n"
    dest: /etc/letsencrypt/cloudflare.ini
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Issue the Let's Encrypt certificate (DNS-01)
  ansible.builtin.command:
    cmd: >-
      certbot certonly --non-interactive --agree-tos
      -m {{ letsencrypt_email }}
      --dns-cloudflare
      --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini
      --dns-cloudflare-propagation-seconds 30
      --cert-name {{ letsencrypt_cert_name }}
      {% for s in monitoring_sites %}-d {{ s.host }} {% endfor %}
    creates: "/etc/letsencrypt/live/{{ letsencrypt_cert_name }}/fullchain.pem"

- name: Reload Nginx after every renewal
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
    content: |
      #!/bin/sh
      systemctl reload nginx
    mode: "0755"

- name: Make sure the renewal timer is active
  ansible.builtin.systemd:
    name: certbot.timer
    enabled: true
    state: started

- name: Basic auth user for Prometheus and Alertmanager
  community.general.htpasswd:
    path: /etc/nginx/.htpasswd-monitoring
    name: "{{ monitoring_basic_auth_user }}"
    password: "{{ monitoring_basic_auth_password }}"
    owner: root
    group: www-data
    mode: "0640"
  no_log: true

- name: Nginx virtual hosts for monitoring
  ansible.builtin.template:
    src: monitoring-vhosts.conf.j2
    dest: /etc/nginx/conf.d/monitoring.example.com.conf
    mode: "0644"
  notify: reload nginx (monitoring vhosts)

- name: Test Nginx config (a failure stops the play before any reload)
  ansible.builtin.command: nginx -t
  changed_when: false
