repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2        # run `pre-commit autoupdate` to refresh
    hooks:
      - id: gitleaks
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
